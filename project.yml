name: MediaPipeIODemo
options:
  bundleIdPrefix: com.google.mediapipe.examples
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  MediaPipeIODemo:
    type: application
    platform: iOS
    sources:
      - path: MediaPipeIODemo
        excludes:
          - "Resources/**"
          - "Info.plist"
      # NOTE: a top-level `resources:` block silently produces no Resources build phase entries
      # in this xcodegen version (2.46.0) — confirmed by testing directly. Folding these into
      # `sources:` with `buildPhase: resources` is what actually works.
      - path: MediaPipeIODemo/Resources/SampleArchive/attention_is_all_you_need.pdf
        buildPhase: resources
      - path: MediaPipeIODemo/Resources/SampleArchive/gpipe.pdf
        buildPhase: resources
      - path: MediaPipeIODemo/Resources/SampleArchive/multi_agent_design.pdf
        buildPhase: resources
      - path: MediaPipeIODemo/Resources/SampleArchive/sample_contract.pdf
        buildPhase: resources
      - path: MediaPipeIODemo/Resources/Models/summarization_quant_200m_2modes.litertlm
        buildPhase: resources
      - path: MediaPipeIODemo/Resources/Models/proofread_quant_200m.litertlm
        buildPhase: resources
      - path: MediaPipeIODemo/Resources/Models/embedding_gemma.task
        buildPhase: resources
      - path: MediaPipeIODemo/Resources/Models/interactive_segmentation.task
        buildPhase: resources
      - path: MediaPipeIODemo/Resources/Assets.xcassets
        buildPhase: resources
    info:
      path: MediaPipeIODemo/Info.plist
      properties:
        CFBundleDisplayName: MediaPipe IO Demo
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Camera access is used to take a photo to turn into a sticker.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.google.mediapipe.examples.iodemo
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: BY52BLBSHN

  MediaPipeIODemoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MediaPipeIODemoTests
      # Compiled directly into the test target too, rather than reached via `@testable import
      # MediaPipeIODemo` — that import would pull in the whole app module's MediaPipeTasksText
      # dependency, and linking that pod a second time into the test bundle crashes at launch
      # ("Function with name FlowLimiterCalculator already registered", MediaPipe's native
      # calculators aren't safe to register twice in one process). These files are pure Swift
      # with no MediaPipe dependency, so just compiling them twice (once per target) sidesteps
      # the whole problem.
      - path: MediaPipeIODemo/UI/Components/WordDiff.swift
      - path: MediaPipeIODemo/Search/VectorIndex.swift
      - path: MediaPipeIODemo/Data/EmailBodySplitter.swift
      - path: MediaPipeIODemo/Data/Storage/StickerCutout.swift
      - path: MediaPipeIODemo/ML/Segmenter/InteractiveSegmenterEngine.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.google.mediapipe.examples.iodemo.tests
        GENERATE_INFOPLIST_FILE: YES

  MediaPipeIODemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MediaPipeIODemoUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.google.mediapipe.examples.iodemo.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MediaPipeIODemo

schemes:
  MediaPipeIODemo:
    build:
      targets:
        MediaPipeIODemo: all
        MediaPipeIODemoTests: [test]
        MediaPipeIODemoUITests: [test]
    test:
      targets:
        - MediaPipeIODemoTests
        - MediaPipeIODemoUITests
    run:
      config: Debug
